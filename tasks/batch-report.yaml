    status: passed
    observed:
      - '@modelcontextprotocol/sdk@1.16.0 listed as direct dependency'
      - 'ws@8.18.2 listed as direct dependency satisfying ^8.18.0'
      - 'Both require.resolve checks printed node_modules paths'
  tests:
